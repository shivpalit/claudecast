[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claudecast"
version = "0.1.0"
description = "generate narrated slide decks and videos from a prompt"
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=6.1",
    "python-pptx>=0.6",
    "lxml>=4.9",
    "pdfplumber>=0.9",
    "python-docx>=1.0",
    "pandas>=2.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
video = ["moviepy>=1.0", "imageio-ffmpeg>=0.4"]
ai = ["anthropic>=0.25"]
all = ["moviepy>=1.0", "imageio-ffmpeg>=0.4", "anthropic>=0.25"]

[project.scripts]
claudecast = "claudecast.cli:main"
